<!DOCTYPE html>
<html lang="fr">
<head>

    <title>{{ page.title }} - {{ site.title }}</title>
    <style>
        body {
          display: flex;
          margin: 0;
          font-family: sans-serif;
        }
        nav {

          height: 100vh;

<nav>
